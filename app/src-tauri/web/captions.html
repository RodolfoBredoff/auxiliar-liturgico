<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legendas — Auxiliar Litúrgico</title>
<style>
  /* Legendas ao vivo do que está sendo falado ou cantado. Use em uma tela, tablet ou no OBS
     (adicione &bg=transparent na URL para fundo transparente e &size=6 para ajustar o tamanho). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  #box { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 3% 5%; box-sizing: border-box; }
  #text { margin: 0; width: 100%; text-align: center; line-height: 1.25; overflow-wrap: anywhere; text-shadow: 0 0.05em 0.12em #000; transition: opacity 0.4s; }
  #status { position: fixed; top: 8px; left: 12px; font-size: 13px; color: #777; }
</style>
</head>
<body>
<div id="status"></div>
<div id="box"><p id="text"></p></div>
<script>
  const q = location.search;
  const params = new URLSearchParams(q);
  if (params.get("bg") === "transparent") document.body.style.background = "transparent";
  const percent = Number(params.get("size")) || 7;
  const box = document.getElementById("box");
  const p = document.getElementById("text");
  let last = "";
  let seenId = null;
  let seenAt = 0;

  function fit() {
    const h = box.clientHeight * 0.9;
    let size = box.clientHeight * percent / 100;
    p.style.fontSize = size + "px";
    while (size > 12 && p.offsetHeight > h) { size *= 0.94; p.style.fontSize = size + "px"; }
  }

  async function tick() {
    let s;
    try { s = await (await fetch("/state" + q, { cache: "no-store" })).json(); }
    catch (e) { document.getElementById("status").textContent = "sem conexão"; return; }
    document.getElementById("status").textContent = "";
    // Some depois de 8 s sem fala nova. O relógio é o deste aparelho (por isso o contador, não a hora).
    if (s.captionId !== seenId) { seenId = s.captionId; seenAt = Date.now(); }
    const fresh = s.captionId && Date.now() - seenAt < 8000;
    const text = fresh ? s.caption || "" : "";
    if (text === last) return;
    last = text;
    p.textContent = text;
    fit();
    p.style.opacity = text ? 1 : 0;
  }
  tick();
  setInterval(tick, 400);
  addEventListener("resize", fit);
</script>
</body>
</html>
